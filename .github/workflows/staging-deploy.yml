name: Disposable staging qualification

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref (branch, tag, or SHA) to deploy
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging (${{ matrix.profile }})
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: mock
            llm_mock: 'true'
          - profile: live
            llm_mock: 'false'
    env:
      COMPOSE_PROJECT_NAME: jury-ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
      COMPOSE_FILE: .ci-compose.json
      DEPLOY_PROFILE: ${{ matrix.profile }}
      LLM_MOCK: ${{ matrix.llm_mock }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Emit deploy start status
        run: |
          echo "::notice title=deploy_start::profile=${DEPLOY_PROFILE} sha=${GITHUB_SHA}"
          echo "deploy_started_at=$(date -u +%FT%TZ)" >> "$GITHUB_ENV"

      - name: Validate staging credential contract
        env:
          OPENROUTER_API_KEY: ${{ matrix.profile == 'live' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          if [[ "${DEPLOY_PROFILE}" == "live" && -z "${OPENROUTER_API_KEY}" ]]; then
            echo "OPENROUTER_API_KEY repository secret is required for the live staging profile."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare staging environment file
        env:
          OPENROUTER_API_KEY: ${{ matrix.profile == 'live' && secrets.OPENROUTER_API_KEY || '' }}
        run: |
          openrouter_key=""
          if [[ "${DEPLOY_PROFILE}" == "live" ]]; then
            openrouter_key="${OPENROUTER_API_KEY}"
          fi

          umask 077
          cp .env.example .env
          {
            echo "LLM_MOCK=${LLM_MOCK}"
            echo "OPENROUTER_API_KEY=${openrouter_key}"
            echo "LOG_LEVEL=info"
            echo "TTS_PROVIDER=noop"
            echo "BROADCAST_PROVIDER=noop"
          } >> .env

      - name: Start an isolated disposable staging stack
        run: |
          set -euo pipefail
          umask 077
          docker compose -f docker-compose.yml --env-file .env config --format json | python3 scripts/staging-compose.py > .ci-compose.json
          docker compose up -d --build --wait --wait-timeout 120

      - name: Resolve this profile's API endpoint
        run: |
          set -euo pipefail
          api=$(docker compose ps -q api)
          test -n "$api"
          if docker inspect --type container "$HOSTNAME" >/dev/null 2>&1; then
            docker network connect "${COMPOSE_PROJECT_NAME}_internal" "$HOSTNAME"
            host=$(docker inspect -f '{{with index .NetworkSettings.Networks "'"${COMPOSE_PROJECT_NAME}_internal"'"}}{{.IPAddress}}{{end}}' "$api")
            port=3001
          else
            host=127.0.0.1
            binding=$(docker compose port api 3001)
            port=${binding##*:}
          fi
          printf 'API_BASE_URL=http://%s:%s\n' "$host" "$port" >> "$GITHUB_ENV"


      - name: Wait for API health
        run: |
          rm -f smoke-health.json
          for _attempt in {1..30}; do
            if curl -fsS "${API_BASE_URL}/api/health" > smoke-health.json; then
              cat smoke-health.json
              exit 0
            fi
            sleep 2
          done
          echo "API health check did not pass within timeout."
          exit 1

      - name: Run staging smoke checks
        run: |
          chmod +x scripts/staging-smoke.sh
          API_BASE_URL="$API_BASE_URL" \
          SMOKE_OUTPUT_PATH="smoke-results.json" \
          scripts/staging-smoke.sh

      - name: Capture deploy metadata
        if: ${{ success() }}
        run: |
          deploy_finished_at="$(date -u +%FT%TZ)"
          cat <<JSON > deploy-metadata.json
          {
            "workflow": "${GITHUB_WORKFLOW}",
            "runId": "${GITHUB_RUN_ID}",
            "runAttempt": "${GITHUB_RUN_ATTEMPT}",
            "profile": "${DEPLOY_PROFILE}",
            "ref": "${GITHUB_REF}",
            "sha": "${GITHUB_SHA}",
            "deployedAt": "${deploy_started_at}",
            "finishedAt": "${deploy_finished_at}",
            "status": "success"
          }
          JSON
          cat deploy-metadata.json

      - name: Ensure deploy metadata exists on failure
        if: ${{ failure() }}
        run: |
          if [[ ! -f deploy-metadata.json ]]; then
            deploy_finished_at="$(date -u +%FT%TZ)"
            cat <<JSON > deploy-metadata.json
            {
              "workflow": "${GITHUB_WORKFLOW}",
              "runId": "${GITHUB_RUN_ID}",
              "runAttempt": "${GITHUB_RUN_ATTEMPT}",
              "profile": "${DEPLOY_PROFILE}",
              "ref": "${GITHUB_REF}",
              "sha": "${GITHUB_SHA}",
              "deployedAt": "${deploy_started_at}",
              "finishedAt": "${deploy_finished_at}",
              "status": "failure"
            }
            JSON
          fi

      - name: Emit deploy end status (success)
        if: ${{ success() }}
        run: |
          echo "::notice title=deploy_end::profile=${DEPLOY_PROFILE} status=success sha=${GITHUB_SHA}"

      - name: Emit deploy end status (failure)
        if: ${{ failure() }}
        run: |
          echo "::error title=deploy_end::profile=${DEPLOY_PROFILE} status=failure sha=${GITHUB_SHA}"

      - name: Capture compose logs
        if: ${{ always() }}
        run: |
          if [ -s .ci-compose.json ]; then docker compose logs --no-color > docker-compose.log; fi

      - name: Tear down compose stack
        if: ${{ always() }}
        run: |
          if [ -s .ci-compose.json ]; then
            if docker inspect --type container "$HOSTNAME" >/dev/null 2>&1; then
              docker network disconnect "${COMPOSE_PROJECT_NAME}_internal" "$HOSTNAME" || true
            fi
            docker compose down -v
          fi

      - name: Remove staging credential file
        if: ${{ always() }}
        run: rm -f .env .ci-compose.json

      - name: Upload deployment artifacts
        if: ${{ always() }}
        uses: https://gitea.com/actions/upload-artifact@c24449f33cd45d4826c6702db7e49f7cdb9b551d
        with:
          name: staging-${{ matrix.profile }}-${{ github.run_id }}
          path: |
            smoke-health.json
            smoke-results.json
            deploy-metadata.json
            docker-compose.log

      - name: Write job summary
        if: ${{ always() }}
        run: |
          echo "### Staging deploy (${DEPLOY_PROFILE})" >> "$GITHUB_STEP_SUMMARY"
          echo "- Ref: \`${GITHUB_REF}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f smoke-results.json ]]; then
            echo "- Smoke checks: ✅ passed" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Smoke checks: ❌ failed" >> "$GITHUB_STEP_SUMMARY"
          fi